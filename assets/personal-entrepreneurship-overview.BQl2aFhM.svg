<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">子敬探索世界：子敬创业，从零单排，创业赚到第N个一百万元长期公开挑战总纲</title>
  <desc id="desc">个人母IP名为子敬探索世界，创业栏目名为子敬创业，固定栏目口号为从零单排。底层思路是坦诚清晰、知行合一、开放独立、创造价值。长期挑战由多个季组成，每一季选择一个具体项目，目标是通过该项目获得一个新的百万元个人所得，但允许失败、停止或转型。单排表示以个人第一视角做判断并承担结果，不排斥朋友、伙伴和团队协作。每季在项目内循环推进、记录结果、形成思考、每周公开、听取建议、选择粉丝评论中最多五个真实问题、独立思考并总结、更新认知与行动。各季沉淀认知能力、知识工具以及基于持续价值形成的信任关系，为下一季提供更好的起点，但不保证成功。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F4F7FC"/><stop offset="100%" stop-color="#EEF8F5"/></linearGradient>
    <linearGradient id="goal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFF3C9"/><stop offset="100%" stop-color="#FFE7A8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17324D" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L11,5.5 L0,11 Z" fill="#486A91"/></marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L11,5.5 L0,11 Z" fill="#4D8065"/></marker>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 43px; font-weight: 700; fill: #172A42; }
      .subtitle { font-size: 22px; font-weight: 400; fill: #607087; }
      .goal-main { font-size: 34px; font-weight: 700; fill: #6B4B00; }
      .goal-sub { font-size: 22px; font-weight: 500; fill: #826A2D; }
      .section { font-size: 29px; font-weight: 700; fill: #172A42; }
      .season-title { font-size: 28px; font-weight: 700; fill: #172A42; }
      .season-main { font-size: 22px; font-weight: 600; fill: #29445F; }
      .season-sub { font-size: 18px; font-weight: 400; fill: #607087; }
      .step-title { font-size: 21px; font-weight: 700; fill: #172A42; }
      .step-sub { font-size: 16px; font-weight: 400; fill: #607087; }
      .asset-title { font-size: 25px; font-weight: 700; fill: #172A42; }
      .asset-sub { font-size: 18px; font-weight: 400; fill: #607087; }
      .note { font-size: 18px; font-weight: 500; fill: #5C6D78; }
      .card { fill: #FFFFFF; stroke: #CDD9E8; stroke-width: 2.5; filter: url(#shadow); }
      .blue { fill: #EAF2FF; stroke: #9DBCF1; stroke-width: 2.5; }
      .green { fill: #EAF8F1; stroke: #91D0AE; stroke-width: 2.5; }
      .purple { fill: #F2EEFF; stroke: #BAA8E9; stroke-width: 2.5; }
      .gold { fill: #FFF4D8; stroke: #E7C55F; stroke-width: 2.5; }
      .edge { fill: none; stroke: #486A91; stroke-width: 4; marker-end: url(#arrow); }
      .compound { fill: none; stroke: #4D8065; stroke-width: 3.5; stroke-dasharray: 10 9; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#background)"/>
  <text x="900" y="54" text-anchor="middle" class="title">子敬探索世界</text>
  <text x="900" y="96" text-anchor="middle" class="subtitle">子敬创业｜从零单排 · 长期公开挑战：创业赚到第 N 个 100 万</text>

  <rect x="250" y="127" width="1300" height="108" rx="34" fill="url(#goal)" stroke="#E7C354" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="900" y="194" text-anchor="middle" class="goal-main">长期目标：通过一季又一季的真实创业，赚到第 N 个 100 万元</text>

  <text x="82" y="306" class="section">多季结构</text>
  <text x="235" y="306" class="subtitle">每一季只围绕一个具体项目，目标是挑战一个新的 100 万</text>

  <rect x="80" y="326" width="430" height="150" rx="28" class="gold" filter="url(#shadow)"/>
  <text x="295" y="370" text-anchor="middle" class="season-title">第一季｜具体项目 A</text>
  <text x="295" y="410" text-anchor="middle" class="season-main">挑战第一个 100 万</text>
  <text x="295" y="444" text-anchor="middle" class="season-sub">项目选定后开始｜全过程真实记录</text>
  <text x="295" y="468" text-anchor="middle" class="season-sub">允许达成、失败、停止或转型</text>

  <path d="M510 401 H585" class="edge"/>

  <rect x="595" y="326" width="430" height="150" rx="28" class="blue" filter="url(#shadow)"/>
  <text x="810" y="370" text-anchor="middle" class="season-title">第二季｜具体项目 B</text>
  <text x="810" y="410" text-anchor="middle" class="season-main">挑战下一个 100 万</text>
  <text x="810" y="444" text-anchor="middle" class="season-sub">继承上一季沉淀，但重新承担项目结果</text>
  <text x="810" y="468" text-anchor="middle" class="season-sub">不是自动成功，也不是简单复制</text>

  <path d="M1025 401 H1100" class="edge"/>

  <rect x="1110" y="326" width="430" height="150" rx="28" class="purple" filter="url(#shadow)"/>
  <text x="1325" y="370" text-anchor="middle" class="season-title">第 N 季｜具体项目 N</text>
  <text x="1325" y="410" text-anchor="middle" class="season-main">挑战第 N 个 100 万</text>
  <text x="1325" y="444" text-anchor="middle" class="season-sub">持续验证认知、执行与长期复利</text>
  <text x="1325" y="468" text-anchor="middle" class="season-sub">只有真实达标，100 万计数才增加</text>

  <rect x="1560" y="326" width="160" height="150" rx="28" class="green" filter="url(#shadow)"/>
  <text x="1640" y="376" text-anchor="middle" class="season-title">长期结果</text>
  <text x="1640" y="417" text-anchor="middle" font-size="29" font-weight="700" fill="#285A40">第 N 个</text>
  <text x="1640" y="454" text-anchor="middle" font-size="29" font-weight="700" fill="#285A40">100 万</text>

  <text x="82" y="523" class="section">每一季共用：单项目周循环</text>
  <text x="485" y="523" class="subtitle">行动和反馈都发生在当季的同一个项目里面</text>

  <rect x="70" y="548" width="1080" height="360" rx="32" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="2.5"/>
  <rect x="100" y="582" width="235" height="82" rx="22" fill="#EDF3FB"/>
  <text x="217" y="616" text-anchor="middle" class="step-title">推进项目行动</text><text x="217" y="646" text-anchor="middle" class="step-sub">围绕本周目标去做</text>
  <path d="M335 623 H365" class="edge"/>
  <rect x="375" y="582" width="235" height="82" rx="22" fill="#EDF3FB"/>
  <text x="492" y="616" text-anchor="middle" class="step-title">记录事实结果</text><text x="492" y="646" text-anchor="middle" class="step-sub">进展、收入、失败、问题</text>
  <path d="M610 623 H640" class="edge"/>
  <rect x="650" y="582" width="235" height="82" rx="22" fill="#EDF3FB"/>
  <text x="767" y="616" text-anchor="middle" class="step-title">形成自己的思考</text><text x="767" y="646" text-anchor="middle" class="step-sub">判断发生了什么变化</text>
  <path d="M885 623 H915" class="edge"/>
  <rect x="925" y="582" width="195" height="82" rx="22" fill="#FFF4D8"/>
  <text x="1022" y="616" text-anchor="middle" class="step-title">每周公开</text><text x="1022" y="646" text-anchor="middle" class="step-sub">成功失败都同步</text>

  <path d="M1022 664 V716" class="edge"/>

  <rect x="885" y="728" width="235" height="82" rx="22" fill="#F2EEFF"/>
  <text x="1002" y="762" text-anchor="middle" class="step-title">真诚听取建议</text><text x="1002" y="792" text-anchor="middle" class="step-sub">粉丝问题、建议与反驳</text>
  <path d="M885 769 H855" class="edge"/>
  <rect x="610" y="728" width="235" height="82" rx="22" fill="#F2EEFF"/>
  <text x="727" y="762" text-anchor="middle" font-size="19" font-weight="700" fill="#2C425B">选择粉丝评论 Top 5</text><text x="727" y="792" text-anchor="middle" class="step-sub">不足 5 条不凑数</text>
  <path d="M610 769 H580" class="edge"/>
  <rect x="335" y="728" width="235" height="82" rx="22" fill="#F2EEFF"/>
  <text x="452" y="762" text-anchor="middle" class="step-title">独立思考并总结</text><text x="452" y="792" text-anchor="middle" class="step-sub">核验、回答、提炼判断</text>
  <path d="M335 769 H305" class="edge"/>
  <rect x="100" y="728" width="195" height="82" rx="22" fill="#EAF8F1"/>
  <text x="197" y="762" text-anchor="middle" class="step-title">更新认知与行动</text><text x="197" y="792" text-anchor="middle" class="step-sub">把新判断带回项目</text>
  <path d="M100 769 C45 769 48 623 94 623" class="compound"/>

  <rect x="145" y="847" width="930" height="38" rx="16" fill="#F2F6F8"/>
  <text x="610" y="873" text-anchor="middle" class="note">当季项目的真实经营结果与符合口径的个人所得持续累计</text>

  <text x="1200" y="523" class="section">跨季复利：下一季继承什么</text>
  <rect x="1180" y="548" width="550" height="360" rx="32" fill="#FFFFFF" stroke="#CDD9E8" stroke-width="2.5"/>

  <rect x="1210" y="580" width="235" height="120" rx="24" class="blue"/>
  <text x="1327" y="620" text-anchor="middle" class="asset-title">能力与知识</text>
  <text x="1327" y="655" text-anchor="middle" class="asset-sub">认知 · 执行 · 工具</text>
  <text x="1327" y="683" text-anchor="middle" class="asset-sub">流程 · 知识库</text>

  <rect x="1465" y="580" width="235" height="120" rx="24" class="green"/>
  <text x="1582" y="620" text-anchor="middle" class="asset-title">粉丝信任复利</text>
  <text x="1582" y="655" text-anchor="middle" class="asset-sub">持续提供真实价值</text>
  <text x="1582" y="683" text-anchor="middle" class="asset-sub">自愿关注 · 互信 · 反馈</text>

  <path d="M1327 700 V742" class="edge"/>
  <path d="M1582 700 V742" class="edge"/>

  <rect x="1210" y="750" width="490" height="74" rx="24" fill="#EEF6F1" stroke="#A7CDB7" stroke-width="2.5"/>
  <text x="1455" y="781" text-anchor="middle" class="asset-title">下一季拥有更好的起点</text>
  <text x="1455" y="810" text-anchor="middle" class="asset-sub">更多信息、反馈、验证机会与传播基础</text>

  <text x="1455" y="857" text-anchor="middle" class="note">粉丝不是可占有的资产；持续价值形成的自愿信任才可能复利</text>
  <text x="1455" y="886" text-anchor="middle" class="note">复利可能降低下一季成本，但不保证下一季成功</text>

  <path d="M1688 750 C1770 680 1770 401 1545 401" class="compound"/>

  <rect x="70" y="935" width="1660" height="130" rx="30" fill="#F1F5F5" stroke="#D4DEE3" stroke-width="2.5"/>
  <text x="110" y="970" font-size="22" font-weight="700" fill="#607087">底层思路</text>
  <line x1="470" y1="974" x2="470" y2="1045" stroke="#D7E0E4" stroke-width="2"/>
  <line x1="860" y1="974" x2="860" y2="1045" stroke="#D7E0E4" stroke-width="2"/>
  <line x1="1250" y1="974" x2="1250" y2="1045" stroke="#D7E0E4" stroke-width="2"/>

  <text x="285" y="1001" text-anchor="middle" font-size="24" font-weight="650" fill="#40566F">坦诚清晰</text>
  <text x="285" y="1037" text-anchor="middle" font-size="17" font-weight="400" fill="#73818E">说真话，把事情讲清楚</text>

  <text x="665" y="1001" text-anchor="middle" font-size="24" font-weight="650" fill="#40566F">知行合一</text>
  <text x="665" y="1037" text-anchor="middle" font-size="17" font-weight="400" fill="#73818E">认知进入行动，结果反向修正</text>

  <text x="1055" y="1001" text-anchor="middle" font-size="24" font-weight="650" fill="#40566F">开放独立</text>
  <text x="1055" y="1037" text-anchor="middle" font-size="17" font-weight="400" fill="#73818E">听取意见，保持自己的判断</text>

  <text x="1485" y="1001" text-anchor="middle" font-size="24" font-weight="650" fill="#40566F">创造价值</text>
  <text x="1485" y="1037" text-anchor="middle" font-size="17" font-weight="400" fill="#73818E">让项目持续创造真实价值</text>
</svg>
