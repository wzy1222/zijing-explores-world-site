<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="2230" viewBox="0 0 2320 2230" role="img" aria-labelledby="title desc"><title id="title">DOTA工作流：领域知识、重点Skill与本地LibTV制作链路</title><desc id="desc">Agent只连接DOTA Workflow统一入口。顶层展开11个节点，每个节点包含作用、DOTA样例和关联方法。内部复用OpenMontage、专业Skill和工具。突出Acting、Cinedance、Lira以及本地修改、通过LibTV Client按包同步到远端生成、结果回收本地。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#8393a4"/></marker><marker id="tealarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#258672"/></marker><style>
text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22384f}.title{font-size:42px;font-weight:700}.subtitle{font-size:23px;fill:#5c7187}.heading{font-size:29px;font-weight:650}.workflow{font-size:34px;font-weight:700}.body{font-size:21px;fill:#3d566e}.example{font-size:20px;fill:#47739b}.field{font-size:18px;font-weight:650;fill:#6c8195}.card-title{font-size:25px;font-weight:650}.index{font:700 20px Menlo,monospace;fill:#2d68a4}.method{font-size:20px;fill:#794ba1}.support{font-size:19px;fill:#6d7c8e}.muted{font-size:19px;fill:#6e8295}.small{font-size:17px;fill:#7b8d9e}.tag{font-size:18px;font-weight:650}.exact{font:18px Menlo,monospace;fill:#775296}.blue{font-size:27px;font-weight:650;fill:#2d68a4}.purple{font-size:27px;font-weight:650;fill:#794ba1}.teal{font-size:27px;font-weight:650;fill:#187461}.arrow{fill:none;stroke:#8393a4;stroke-width:2.2;marker-end:url(#arr)}.sync{fill:none;stroke:#258672;stroke-width:2.5;marker-end:url(#tealarr)}.brace{fill:none;stroke:#c2ccda;stroke-width:3}.stage:hover rect:first-of-type,.stage:focus rect:first-of-type{fill:#eef5ff;stroke:#528cc0;stroke-width:2}.stage:focus{outline:none}
</style></defs>
