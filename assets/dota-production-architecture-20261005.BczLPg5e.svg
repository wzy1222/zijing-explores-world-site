<text x="294" y="300" class="workflow">DOTA Workflow</text>
<text x="294" y="335" class="muted">统一进入当前制作节点</text>
<text x="725" y="301" class="body">开始 / 续做  →  定位节点  →  读取要求与方法  →  交回成果</text>
<text x="725" y="336" class="muted">下方连线表示工作流内部的能力依赖。</text>
